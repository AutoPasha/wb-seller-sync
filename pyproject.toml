[project]
name = "wb-seller-sync"
version = "0.1.0"
description = "Read-only коннектор Wildberries Seller API: карточки, остатки, заказы, продажи, отчёт о реализации"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wb-sync = "wbsync.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wbsync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
